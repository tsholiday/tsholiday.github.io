<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sewa Kendaraan - JelajahRute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-navy-900 dark:bg-navy-900 dark:text-gray-100 min-h-screen flex flex-col justify-center items-center p-4 transition-colors duration-300 font-sans">

    <!-- Container Utama Kalkulator -->
    <div class="w-full max-w-xl bg-white dark:bg-navy-800 p-6 sm:p-8 rounded-3xl shadow-xl border border-amber-500/20 relative">
        
        <!-- Toggle Dark Mode (Atas Kanan) -->
        <button onclick="toggleDarkMode()" class="absolute top-4 right-4 p-2 rounded-xl bg-gray-100 dark:bg-navy-900 text-amber-500 hover:scale-105 transition" title="Ganti Mode Tampilan">
            🌙
        </button>

        <!-- Judul -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-navy-900 dark:text-white">Jelajah<span class="text-amber-500">Rute</span></h1>
            <h2 class="text-base font-bold mt-1">🧮 Kalkulator Sewa Kendaraan</h2>
            <p class="text-xs text-gray-500 dark:text-gray-400">Hitung estimasi biaya sewa mobil & driver secara instan</p>
        </div>

        <!-- Form Input Kalkulator -->
        <div class="space-y-4">
            <!-- Pilih Armada -->
            <div>
                <label class="block text-xs font-bold mb-2">Pilih Armada Kendaraan:</label>
                <select id="calcCar" onchange="calculateTotal()" class="w-full bg-gray-50 dark:bg-navy-900 border border-gray-300 dark:border-gray-700 rounded-xl p-3 text-xs font-semibold focus:outline-none focus:border-amber-500">
                    <option value="500000" data-name="Toyota Calya / Sigra">Toyota Calya / Sigra (Rp 500rb/hari)</option>
                    <option value="600000" data-name="Toyota Avanza" selected>Toyota Avanza (Rp 600rb/hari)</option>
                    <option value="800000" data-name="Innova Reborn Diesel">Innova Reborn Diesel (Rp 800rb/hari)</option>
                    <option value="950000" data-name="Innova Zenix">Innova Zenix (Rp 950rb/hari)</option>
                    <option value="1200000" data-name="Toyota HiAce Commuter">Toyota HiAce Commuter (Rp 1.2jt/hari)</option>
                    <option value="2500000" data-name="Toyota Alphard VIP">Toyota Alphard VIP (Rp 2.5jt/hari)</option>
                </select>
            </div>

            <!-- Durasi Hari & Area Tujuan -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold mb-2">Durasi Sewa (Hari):</label>
                    <input type="number" id="calcDays" value="1" min="1" max="30" onchange="calculateTotal()" onkeyup="calculateTotal()" class="w-full bg-gray-50 dark:bg-navy-900 border border-gray-300 dark:border-gray-700 rounded-xl p-3 text-xs font-semibold focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-bold mb-2">Tujuan Area Utama:</label>
                    <select id="calcArea" onchange="calculateTotal()" class="w-full bg-gray-50 dark:bg-navy-900 border border-gray-300 dark:border-gray-700 rounded-xl p-3 text-xs font-semibold focus:outline-none focus:border-amber-500">
                        <option value="Jakarta City">Jakarta City Tour</option>
                        <option value="Bogor / Puncak">Bogor & Puncak</option>
                        <option value="Bandung / Ciwidey / Lembang">Bandung (Ciwidey/Lembang)</option>
                        <option value="Yogyakarta">Yogyakarta (Jogja)</option>
                    </select>
                </div>
            </div>

            <!-- Box Hasil & Tombol WA -->
            <div class="bg-amber-500/10 border border-amber-500/30 p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4 mt-6">
                <div class="text-center sm:text-left">
                    <span class="text-xs text-gray-500 dark:text-gray-400 block">Estimasi Biaya + Driver:</span>
                    <span id="calcResult" class="text-2xl sm:text-3xl font-black text-amber-500">Rp 600.000</span>
                </div>
                <button onclick="sendOrderWA()" class="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 text-navy-900 font-extrabold px-6 py-3.5 rounded-xl text-xs shadow-lg hover:shadow-amber-500/20 transition">
                    Pesan via WhatsApp 📱
                </button>
            </div>
        </div>

    </div>

    <!-- Script Logika Kalkulator -->
    <script>
        // Logika Hitung Total Biaya
        function calculateTotal() {
            const price = parseInt(document.getElementById('calcCar').value);
            const days = parseInt(document.getElementById('calcDays').value) || 1;
            const total = price * days;
            
            document.getElementById('calcResult').innerText = "Rp " + total.toLocaleString('id-ID');
        }

        // Format Teks Otomatis ke WhatsApp
        function sendOrderWA() {
            const carSelect = document.getElementById('calcCar');
            const carName = carSelect.options[carSelect.selectedIndex].getAttribute('data-name');
            const days = document.getElementById('calcDays').value;
            const area = document.getElementById('calcArea').value;
            const total = document.getElementById('calcResult').innerText;

            const text = `Halo Admin JelajahRute, saya ingin cek ketersediaan sewa armada:%0A%0A- *Armada*: ${carName}%0A- *Durasi*: ${days} Hari%0A- *Tujuan*: ${area}%0A- *Estimasi Biaya*: ${total}%0A%0AMohon info ketersediaan tanggalnya, terima kasih!`;
            
            window.open(`https://wa.me/6282130640161?text=${text}`, '_blank');
        }

        // Toggle Dark Mode
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        // Hitung awal saat web dibuka
        calculateTotal();
    </script>
</body>
</html>
