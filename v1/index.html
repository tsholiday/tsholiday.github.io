<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sewa Mobil & Paket Wisata Bandung | TSHoliday</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header akan dimuat otomatis di sini -->
    <div id="header-placeholder"></div>

    <!-- Konten Utama (Hero Section, dll) -->
    <section id="home" class="hero-section">
        <video autoplay loop muted playsinline class="hero-video-el">
            <source src="assets/video/hero.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay-el"></div>
        <div class="hero-content-box">
            <h1 class="hero-title">"Don't Just Travel, <br><span>Keepgoing</span> to the Extraordinary"</h1>
            <p class="hero-desc">Sewa mobil dan paket wisata Bandung untuk perjalanan nyaman, aman, dan fleksibel.</p>
            <div class="hero-buttons">
                <a href="#booking" class="btn-hero-primary">Pesan Sekarang</a>
                <a href="#paket" class="btn-hero-outline">Lihat Paket</a>
            </div>
        </div>
    </section>

    <!-- Footer akan dimuat otomatis di sini -->
    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>
</html>
